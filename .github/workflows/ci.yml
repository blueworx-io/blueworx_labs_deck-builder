name: CI
on: pull_request

# The rules live in the foundation. `foundation_ref` must match the `@ref`:
# they default apart, so pinning only the first runs the v1 workflow against
# whatever is on the foundation's main branch today.
#
# Both are pinned to the branch that adds the deck editor's three controls
# (foundation PR #69) rather than to v1, because this plugin's editor screens
# use them and v1 does not have them yet. They go back to v1 the moment that
# PR is merged and the v1 tag moves onto it.
jobs:
  guardrails:
    uses: blueworx-io/bluegroup_core_foundation/.github/workflows/ci-wordpress.yml@add-deck-editor-controls
    with:
      plugin_slug: blueworx-labs-deck-builder
      use_local_wordpress: true
      foundation_ref: add-deck-editor-controls
    secrets: inherit
